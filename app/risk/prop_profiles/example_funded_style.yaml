name: example_funded_style
description: "Example of a fund-rule profile where copy-trading is NOT allowed (forces pure-ML mode). Rule values are placeholders — confirm each against the firm."
broker: ""

# Firm hard limits (placeholder numbers — VERIFY)
capital: 50000
profit_target: 0.10
daily_loss_limit_pct: 0.03
